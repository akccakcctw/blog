[build]
  publish = "dist"
  # 先清掉 Astro 的 content layer 快取再建置。
  #
  # node_modules/.astro 存放已渲染的 Markdown HTML，而 Netlify 會快取整個
  # node_modules。Markdown 沒變動時 Astro 會直接沿用快取，導致 rehype plugin
  # （src/plugins/rehype-r2-image.mjs）的修改在部署後靜默失效 —— 建置會成功、
  # 沒有任何錯誤，但產出仍是舊的。
  #
  # 本站只有 191 篇文章、完整建置不到 10 秒，重新渲染的成本遠低於這個坑的代價。
  command = "rm -rf node_modules/.astro && pnpm build"
